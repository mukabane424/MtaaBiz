                    <div class="col-12">
                        <label for="subject-field" class="form-label">
                            Subject <span class="required-star">*</span>
                        </label>
                        <input
                            type="text"
                            name="subject"
                            id="subject-field"
                            class="form-control"
                            placeholder="Brief summary of the inquiry"
                            value="{{ contact.subject|default:'' }}"
                            required
                        >
                        <div class="invalid-feedback">Please enter a subject line.</div>
                    </div>

                    <div class="col-12">
                        <label for="message-field" class="form-label">
                            Message <span class="required-star">*</span>
                        </label>
                        <textarea
                            name="message"
                            id="message-field"
                            class="form-control"
                            rows="6"
                            placeholder="Write the message details here..."
                            maxlength="2000"
                            required
                        >{{ contact.message|default:'' }}</textarea>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="invalid-feedback">Message body cannot be empty.</div>
                            <div class="char-counter ms-auto"><span id="charCount">0</span> / 2000</div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <span class="unsaved-indicator" id="unsavedIndicator">Unsaved changes</span>
                    <div class="action-buttons">
                        <a href="javascript:history.back()" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-save" id="submitBtn">
                            <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                            <span id="btnText">Update Contact</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('editContactForm');
            const messageField = document.getElementById('message-field');
            const charCount = document.getElementById('charCount');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const unsavedIndicator = document.getElementById('unsavedIndicator');

            function updateCounter() {
                charCount.textContent = messageField.value.length;
            }
            updateCounter();
            messageField.addEventListener('input', updateCounter);

            const inputs = form.querySelectorAll('input, textarea');
            inputs.forEach(function (input) {
                input.addEventListener('input', function () {
                    unsavedIndicator.classList.add('visible');
                });
            });

            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    unsavedIndicator.classList.remove('visible');
                    submitBtn.disabled = true;
                    btnSpinner.classList.remove('d-none');
                    btnText.textContent = 'Updating...';
                }
                form.classList.add('was-validated');
            });
        });
    </script>
</body>
</html>
